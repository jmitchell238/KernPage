# cargo-deny policy for KernPage (MIT OR Apache-2.0 distribution).
# Run: cargo deny check          (advisories, bans, licenses, sources)
# Needs: cargo install cargo-deny --locked
# Workspace path dependencies carry no version, so wildcards only warn.

[graph]
# Only what ships on Windows matters; the other targets pull in X11/Wayland/macOS crates that are
# never built into the Windows installer.
targets = ["x86_64-pc-windows-gnu", "x86_64-pc-windows-msvc"]

[advisories]
version = 2
yanked = "deny"
# Reviewed and accepted advisories go here with a reason, for example:
# ignore = [{ id = "RUSTSEC-0000-0000", reason = "why it cannot be reached" }]
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser (unmaintained, no known vulnerability): safe Rust, parses only fonts installed on the machine; replacement (skrifa) would change PDF output; tracked in the audit report" },
]

[licenses]
version = 2
# Every license a dependency may be used under, all compatible with shipping under MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
# No network or TLS stacks beyond rustls (the launcher uses ureq + rustls); no OpenSSL.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
