# cargo-about configuration: builds THIRD_PARTY_LICENSES.html for the Windows installer.
#   cargo about generate about.hbs -o THIRD_PARTY_LICENSES.html
# (packaging/windows/package.ps1 does this and ships the file in the install folder.)
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
# Only what ships on Windows (same targets as deny.toml).
targets = ["x86_64-pc-windows-gnu", "x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
workarounds = ["ring"]
