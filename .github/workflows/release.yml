# Builds, tests, packages and signs a KernPage release. See docs/RELEASING.md.
#
#   push tag vX.Y.Z      -> build + test + package, then (after the owner approves the `release`
#                           environment) sign the update feed and publish the GitHub release.
#   workflow_dispatch    -> dry run: same build, feed signed with a THROWAWAY key, nothing published,
#                           the real signing key is never touched.
name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and sign with a throwaway key but do not publish (the only mode for manual runs)'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_TARGET_DIR: target-win

jobs:
  build:
    name: Build, test and package
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag and the version
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          if ($manifest -notmatch '(?ms)\[workspace\.package\].*?^\s*version\s*=\s*"(\d+\.\d+\.\d+)"') { throw 'Cannot read the workspace version.' }
          $version = $Matches[1]
          "VERSION=$version" | Add-Content $env:GITHUB_ENV
          if ($env:EVENT -eq 'push') {
            if ($env:TAG -ne "v$version") { throw "Tag $($env:TAG) does not match Cargo.toml version $version." }
            git fetch origin main --quiet
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw 'The tagged commit is not on main; releases are made from main only.' }
            if (-not (Test-Path "docs/release-notes/$version.md")) { throw "Missing docs/release-notes/$version.md" }
          }

      - name: Install the Rust toolchain (GNU, like local builds; version pinned by rust-toolchain.toml)
        shell: pwsh
        run: |
          rustup set default-host x86_64-pc-windows-gnu
          rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.100.0
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc'
          'C:\msys64\ucrt64\bin' | Add-Content $env:GITHUB_PATH
          rustc -vV

      - name: Install .NET (for WiX)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX 5.0.2 and its extensions
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Add-Content $env:GITHUB_PATH
          $wix = "$env:USERPROFILE\.dotnet\tools\wix.exe"
          & $wix extension add -g WixToolset.UI.wixext/5.0.2
          & $wix extension add -g WixToolset.Util.wixext/5.0.2
          & $wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2

      - name: Install cargo-about (dependency licence texts)
        shell: pwsh
        run: |
          cargo install cargo-about --locked --version 0.9.3 --features cli
          if ($LASTEXITCODE -ne 0) { throw 'cargo-about install failed' }

      - name: Run the full test suite
        shell: pwsh
        run: |
          cargo test --locked --workspace -j 2 -- --test-threads=4
          if ($LASTEXITCODE -ne 0) { throw 'tests failed' }

      - name: Build the MSI and Setup.exe
        shell: pwsh
        run: |
          ./packaging/windows/package.ps1
          ./packaging/windows/check-installer.ps1

      - name: Build the release tool
        shell: pwsh
        run: |
          cargo build --locked --release -j 2 -p kernpage-release
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }

      - name: Dry run - sign with a throwaway key (never the real one)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tool = "target-win\release\kernpage-release.exe"
          & $tool keygen --out-dir "$env:RUNNER_TEMP\throwaway" --name dry
          if ($LASTEXITCODE -ne 0) { throw 'keygen failed' }
          $env:KERNPAGE_SIGNING_KEY = Get-Content "$env:RUNNER_TEMP\throwaway\dry.key" -Raw
          $notes = "$env:RUNNER_TEMP\notes.md"
          if (Test-Path "docs/release-notes/$env:VERSION.md") { Copy-Item "docs/release-notes/$env:VERSION.md" $notes } else { Set-Content $notes "## Changed`n- Dry run`n" }
          & $tool sign-feed --version $env:VERSION `
            --msi "target-win\installer\KernPage-$env:VERSION-x64.msi" `
            --setup "target-win\installer\KernPage-$env:VERSION-Setup.exe" `
            --notes $notes --out-dir dry-run-feed
          if ($LASTEXITCODE -ne 0) { throw 'sign-feed failed' }

      - name: Upload the build (installers, release notes, dry-run feed)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          retention-days: 7
          if-no-files-found: error
          path: |
            target-win/installer/KernPage-*-x64.msi
            target-win/installer/KernPage-*-Setup.exe
            docs/release-notes/
            dry-run-feed/

  publish:
    name: Sign the feed and publish
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the Rust toolchain (GNU, like local builds; version pinned by rust-toolchain.toml)
        shell: pwsh
        run: |
          rustup set default-host x86_64-pc-windows-gnu
          rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.100.0
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc'
          'C:\msys64\ucrt64\bin' | Add-Content $env:GITHUB_PATH
          rustc -vV

      - name: Build the release tool from the tag
        shell: pwsh
        run: |
          cargo build --locked --release -j 2 -p kernpage-release
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build
          path: build

      - name: Sign the update feed
        shell: pwsh
        env:
          KERNPAGE_SIGNING_KEY: ${{ secrets.KERNPAGE_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected tag $($env:TAG)" }
          if ([string]::IsNullOrWhiteSpace($env:KERNPAGE_SIGNING_KEY)) { throw 'KERNPAGE_SIGNING_KEY is not available.' }
          $installer = "build\target-win\installer"
          $msi = "$installer\KernPage-$version-x64.msi"
          $setup = "$installer\KernPage-$version-Setup.exe"
          foreach ($f in $msi, $setup) { if (-not (Test-Path $f)) { throw "Missing $f" } }
          # The previous feed (if any) keeps older versions available for "Install an older version".
          # It must have been signed by this same key; the tool checks that and refuses otherwise.
          $prev = @()
          New-Item -ItemType Directory -Force prev | Out-Null
          gh release download --repo $env:REPO --pattern 'index.json' --pattern 'index.json.minisig' --dir prev 2>$null
          if ((Test-Path prev\index.json) -and (Test-Path prev\index.json.minisig)) { $prev = @('--previous', 'prev\index.json') }
          else { Write-Host 'No previous feed: this is the first release (or the old feed is unavailable).' }
          # The launcher's key list at the tagged commit, so the tool refuses a signing key that
          # installed launchers would not trust.
          gh api "repos/$($env:REPO)/contents/crates/kernpage-launcher/src/feed.rs?ref=$($env:TAG)" -H 'Accept: application/vnd.github.raw' | Set-Content feed.rs -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'could not fetch feed.rs' }
          & "target-win\release\kernpage-release.exe" sign-feed --version $version `
            --msi $msi --setup $setup --notes "build\docs\release-notes\$version.md" `
            --launcher-source feed.rs --out-dir signed @prev
          if ($LASTEXITCODE -ne 0) { throw 'sign-feed failed' }

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $installer = "build\target-win\installer"
          # The release page starts with how to install; the launcher's "What's new" uses the notes alone.
          $body = "$env:RUNNER_TEMP\release-body.md"
          @(
            "**To install:** download ``KernPage-$version-Setup.exe`` below and run it. You can ignore the other files.",
            "Windows will warn about an unknown publisher the first time; that is expected. Step-by-step help with pictures: [INSTALL.md](https://github.com/$($env:REPO)/blob/main/INSTALL.md).",
            ""
          ) + (Get-Content "build\docs\release-notes\$version.md") | Set-Content $body -Encoding utf8
          # Draft first so the new index and its signature appear together, then publish.
          gh release create $env:TAG --repo $env:REPO --verify-tag --draft `
            --title "KernPage $version" --notes-file $body `
            "$installer\KernPage-$version-x64.msi" "$installer\KernPage-$version-Setup.exe" `
            signed\index.json signed\index.json.minisig
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
          gh release edit $env:TAG --repo $env:REPO --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'gh release edit failed' }
