[package]
name = "kernpage-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Loopback test feeds: `--feed-url`, `--update-now`, the TEST-ONLY signing key and plain-http file
# links. Always on in debug and test builds; OFF in normal release builds (security review M3).
dev-feed = []

[[bin]]
name = "kernpage-launcher"
path = "src/main.rs"

[dependencies]
kernpage-core = { path = "../kernpage-core" }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = { version = "0.18" }
png = "0.18.1"
tray-icon = { version = "0.26", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
minisign-verify = "0.3"
sha2 = "0.11"
# Update checks: ureq (blocking, rustls) rather than reqwest: no async runtime, far fewer
# dependencies and a faster build. The Windows system proxy is read separately (net.rs).
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[dev-dependencies]
# Test-only: signs the sample feed (the launcher itself only verifies).
minisign = "0.7"
# Test-only: the release tool whose output the round-trip tests verify with the launcher's own code.
kernpage-release = { path = "../kernpage-release" }
egui_kittest = { version = "0.37.0", features = ["eframe"] }

[[example]]
name = "fake-feed"
path = "examples/fake-feed.rs"

[[example]]
name = "gen-test-keys"
path = "examples/gen-test-keys.rs"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
