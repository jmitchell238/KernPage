[package]
name = "kernpage"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kernpage-core = { path = "../kernpage-core" }
pub-format = { path = "../pub-format" }
pub2pdf = { path = "../pub2pdf" }
metafile = { path = "../metafile" }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = { version = "0.18" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
png = "0.18.1"
kernicons = "0.1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps"] }
# Windows.Data.Pdf (built into Windows 10 and later) draws the PDF pages that are sent to the printer.
windows = { version = "0.62", default-features = false, features = ["Data_Pdf", "UI", "Storage_Streams", "Foundation", "Win32_System_WinRT"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe"] }
